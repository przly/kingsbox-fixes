<!DOCTYPE html>
<html lang="sl">
	<head>
		<title>Kingsbox – Free shipping card sandbox</title>

		<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="format-detection" content="telephone=no" />
		<meta content="#000000" name="theme-color" />

		<link rel="icon" type="image/png" sizes="32x32" href="/source/images/favicon/favicon-32x32.png" />

		<!-- Generated by vite.config.js from source/scss/style.scss + source/components/**/*.scss -->
		<link rel="stylesheet" href="/source/css/bundle.css" />
		<link rel="stylesheet" href="/sandbox/sandbox.css" />

		<!-- @atoms/fonts/fonts.twig -->
		<link rel="stylesheet" href="https://use.typekit.net/idw8wqs.css" />
	</head>
	<body>
		<main class="main : sandbox-no-header">
			<section class="sc-general : bg-white" tabindex="-1" role="region">
				<div class="container : sandbox-center">
					<!-- .cart-popup gives the card its side cart styles (cart-popup.scss scopes them to it). sandbox.css undoes
					     the popup's fixed overlay and sets the side cart's content width -->
					<!-- data-unit-price and data-threshold drive sandbox/free-shipping.js: the quantity times the price is the
					     cart total. The card starts at the values for 3 × 699 € -->
					<div class="cart-popup : sandbox-cart-popup" data-free-shipping-demo data-unit-price="699" data-threshold="2999">
						<!-- START: 02-molecules/free-shipping-indicator/free-shipping-indicator.twig, copied from the side cart
						     in /home/ -->
						<div data-component="mol-free-shipping-indicator" class="free-shipping-indicator : gray-dotted-box : text--md">
							<div class="free-shipping-indicator__text : text--20 : text--bd : z-top">
								Add <strong>902 €</strong> more to earn free shipping!
							</div>

							<div class="free-shipping-indicator__text : free-shipping-indicator__free : text--20 : text--bd : z-top">
								Your order ships for <strong>FRee!</strong>
							</div>

							<div class="free-shipping-indicator__inner : z-top">
								<div class="free-shipping-indicator__texts : text--10 : text--gray-400 : font-secondary : slashed-zero">
									<div class="free-shipping-indicator__amount : free-shipping-indicator__amount--end">
										Earn free shipping above 2.999 €
									</div>
								</div>

								<div class="free-shipping-indicator__progress-bar" data-start="69.9" data-end="">
									<div class="free-shipping-indicator__progress-bar-inner" style="width: 69.9%"></div>
									<div class="free-shipping-indicator__progress-bar-extra"></div>
								</div>
							</div>
						</div>
						<!-- END: free-shipping-indicator -->

						<!-- START: 02-molecules/quantity-counter/quantity-counter.twig, copied from a side cart item in /home/,
						     starting at 3, light and dark. It sits outside .cart-view__item, so cart-popup.js does not send it to the server -->
						<div class="sandbox-quantity">
							<div data-component="mol-quantity-counter" class="quantity-counter" data-min-value="1">
								<button
									type="button"
									class="quantity-counter__button : d-flex-cc : quantity-counter__button--remove"
									aria-label="Remove Button"
								>
									<i data-component="at-icon" class="icon : icon-minus "></i>
								</button>
								<input
									class="quantity-counter__input"
									type="text"
									value="3"
									id="counter-input-171"
									name="counter-input"
									aria-label="counter-input"
									readonly
								/>
								<button
									type="button"
									class="quantity-counter__button : d-flex-cc : quantity-counter__button--add"
									aria-label="Add Button"
								>
									<i data-component="at-icon" class="icon : icon-plus "></i>
								</button>
							</div>

							<!-- The same counter on a black background (.bg-black), the dark instance used on product accessory
							     cards. sandbox/free-shipping.js ignores it, so only the light counter drives the card -->
							<div class="bg-black : sandbox-dark-tile">
								<div data-component="mol-quantity-counter" class="quantity-counter" data-min-value="1">
									<button
										type="button"
										class="quantity-counter__button : d-flex-cc : quantity-counter__button--remove"
										aria-label="Remove Button"
									>
										<i data-component="at-icon" class="icon : icon-minus "></i>
									</button>
									<input
										class="quantity-counter__input"
										type="text"
										value="3"
										id="counter-input-172"
										name="counter-input"
										aria-label="counter-input"
										readonly
									/>
									<button
										type="button"
										class="quantity-counter__button : d-flex-cc : quantity-counter__button--add"
										aria-label="Add Button"
									>
										<i data-component="at-icon" class="icon : icon-plus "></i>
									</button>
								</div>
							</div>
						</div>
						<!-- END: quantity-counter -->
					</div>
				</div>
			</section>
		</main>

		<!-- Makes isFractal() true in scripts/01_default.js -->
		<div class="Frame" hidden></div>

		<!-- Same script bundle as /home/: every component script, like production -->
		<script type="module" src="/sandbox/home.js"></script>

		<!-- Sandbox only: updates the card from the quantity, which the server does in production -->
		<script type="module" src="/sandbox/free-shipping.js"></script>
		<!-- Sandbox only: page switcher, bottom left -->
		<script type="module" src="/sandbox/route-switcher.js"></script>
	</body>
</html>
