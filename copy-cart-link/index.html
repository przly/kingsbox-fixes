<!DOCTYPE html>
<html lang="sl">
	<head>
		<title>Kingsbox – Copy cart link sandbox</title>

		<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="format-detection" content="telephone=no" />
		<meta content="#000000" name="theme-color" />

		<link rel="icon" type="image/png" sizes="32x32" href="/source/images/favicon/favicon-32x32.png" />

		<!-- Generated by vite.config.js from source/scss/style.scss + source/components/**/*.scss -->
		<link rel="stylesheet" href="/source/css/bundle.css" />
		<link rel="stylesheet" href="/sandbox/sandbox.css" />

		<!-- @atoms/fonts/fonts.twig -->
		<link rel="stylesheet" href="https://use.typekit.net/idw8wqs.css" />
	</head>
	<body>
		<main class="main : sandbox-no-header">
			<section class="sc-general : bg-white" tabindex="-1" role="region">
				<div class="container : sandbox-top-right">
					<div class="sandbox-row">
						<!-- The "Copy Cart link" button from 02-molecules/cart-popup/cart-popup.twig, copied from the side cart
						     header in /home/, on the side cart's white background -->
						<span
							data-component="at-button"
							class="btn : btn--white : btn--with-icon  : cart-popup__copy-btn : btn--mono-font"
							data-copy-button
							data-copy-text="https://www.google.com"
						>
							<span class="btn__text">Copy Cart link</span>
							<span class="btn__icon : d-flex-cc"><i class="icon : icon-copy" aria-hidden="true"></i></span>
						</span>

						<!-- The product detail page's "copy code" button: @atoms/button/button.twig with modifier 'gray',
						     icon 'copy' and no text (btn--only-icon), rendered by hand. The code is a placeholder -->
						<span
							data-component="at-button"
							class="btn : btn--gray : btn--only-icon "
							aria-label="Copy code"
							data-copy-button
							data-copy-text="KB-000000"
							data-copied-text="Code copied"
						>
							<span class="btn__icon : d-flex-cc"><i class="icon : icon-copy" aria-hidden="true"></i></span>
						</span>
					</div>
				</div>
			</section>
		</main>

		<!-- Makes isFractal() true in scripts/01_default.js -->
		<div class="Frame" hidden></div>

		<!-- Same script bundle as /home/: every component script, like production. The copy handler and its "copied"
		     state are in scripts/01_default.js, the styles in 01-atoms/button/button.scss -->
		<script type="module" src="/sandbox/home.js"></script>
		<!-- Sandbox only: page switcher, bottom left -->
		<script type="module" src="/sandbox/route-switcher.js"></script>
	</body>
</html>
