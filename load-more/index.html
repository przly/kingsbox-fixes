<!DOCTYPE html>
<html lang="sl">
	<head>
		<title>Kingsbox – Load more button sandbox</title>

		<meta http-equiv="content-type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="format-detection" content="telephone=no" />
		<meta content="#000000" name="theme-color" />

		<link rel="icon" type="image/png" sizes="32x32" href="/source/images/favicon/favicon-32x32.png" />

		<!-- Generated by vite.config.js from source/scss/style.scss + source/components/**/*.scss -->
		<link rel="stylesheet" href="/source/css/bundle.css" />
		<link rel="stylesheet" href="/sandbox/sandbox.css" />

		<!-- @atoms/fonts/fonts.twig -->
		<link rel="stylesheet" href="https://use.typekit.net/idw8wqs.css" />
	</head>
	<body>
		<main class="main : sandbox-no-header">
			<section class="sc-general : bg-white" tabindex="-1" role="region">
				<div class="container : sandbox-center">
					<!-- START: the product listing's load more footer from 03-modules/product-list/product-list.twig, with
					     @atoms/button/button.twig rendered by hand (type 'button', class_name 'load-more-products',
					     remove_icon, mono_font, text "Load more" from product-list.config.json). product-list.js is not loaded:
					     it fetches the next page from the server. sandbox/load-more.js stands in for its loading state -->
					<div class="product-list__footer : text-center" data-product-list-load-more>
						<div class="product-list__load-more">
							<button
								data-component="at-button"
								class="btn : btn--default : btn--without-icon  : load-more-products : btn--mono-font"
								type="button"
							>
								<span class="btn__text">Load more</span>
							</button>

							<!-- The header search's spinner (@atoms/loader/loader.twig), shown while loading -->
							<span class="product-list__load-more-spinner" aria-hidden="true">
								<span class="mod-loader__spinner"></span>
							</span>
						</div>
					</div>
					<!-- END: product-list__footer -->
				</div>
			</section>
		</main>

		<!-- Makes isFractal() true in scripts/01_default.js -->
		<div class="Frame" hidden></div>

		<!-- Same script bundle as /home/: every component script, like production -->
		<script type="module" src="/sandbox/home.js"></script>
		<!-- Sandbox only: the loading state product-list.js sets while it fetches the next page -->
		<script type="module" src="/sandbox/load-more.js"></script>
		<!-- Sandbox only: page switcher, bottom left -->
		<script type="module" src="/sandbox/route-switcher.js"></script>
	</body>
</html>
